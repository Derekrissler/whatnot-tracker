name: track

on:
  schedule:
    # Every 2 hours at :17 — 12 commits a day.
    #
    # Why not once a day: a daily run only ever samples ONE hour, so the
    # "when to stream" heatmap would stay empty for the other 23. Every 2
    # hours fills the whole grid in about two weeks.
    #
    # Want it truly daily? Change this to '17 1 * * *' (= 9pm ET) and you'll
    # still get the streamer leaderboard, just no heatmap.
    #
    # Odd minute on purpose — :00 queues behind everyone else's jobs and
    # routinely runs 10+ minutes late. GitHub cron is UTC only.
    - cron: '17 */2 * * *'
  workflow_dispatch:          # gives you a manual "Run workflow" button

permissions:
  contents: write             # required so the job can push the new data

concurrency:
  group: track
  cancel-in-progress: false   # never let two samples race each other

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Take a sample and rebuild the summary
        env:
          # Leave these unset and it runs on synthetic demo data.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
        run: python run.py

      - name: Commit the new data and the refreshed README
        run: |
          git config user.name  "show-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git diff --staged --quiet || git commit -m "update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
